[package]
name = "yeetdrop"
version = "0.1.0"
edition = "2021"
description = "AirDrop for Linux: send and receive files with nearby Apple devices"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
ctrlc = { version = "3", features = ["termination"] }
indicatif = "0.18"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
